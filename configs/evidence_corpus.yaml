evidence:
  schema_version: "0.1.0"
  dataset_scale: "summer_s3_5_bounded_scale"
  normalizer_version: "v0.1.0"
  markdown_parser_version: "v0.1.0"
  chunker_version: "v0.1.1"
sources:
  include_github_readme: true
  include_repo_metadata: true
normalization:
  unicode_form: "NFC"
  normalize_line_endings: true
  collapse_blank_lines: true
  max_consecutive_blank_lines: 2
  remove_decorative_badges: false
chunking:
  max_chunk_chars: 1600
  overlap_chars: 160
  min_chunk_chars: 120
  preserve_code_blocks: true
  preserve_tables: true
review:
  short_document_chars: 200
  oversized_chunk_chars: 2200
random_seed: 42
inputs:
  resource_manifest: "data/metadata/build_manifest.json"
paths:
  evidence_root: "data/evidence"
  metadata_root: "data/metadata"
  reports_root: "data/reports"
  quarantine_root: "data/quarantine/evidence"
  review_root: "data/review/evidence"
  staging_root: "data/.evidence-staging"
