benchmark_version: "1.0.0"
cases:
  - case_id: abstention_001_normal_recommend
    kind: full_corpus
    description: Normal in-domain PyTorch learning request should produce at least one accepted recommendation.
    intent:
      topics: ["Deep Learning"]
      skills: ["Python"]
      prerequisites: []
      framework_preferences: ["PyTorch"]
      language: []
      difficulty: unknown
      learning_style: ["hands_on"]
